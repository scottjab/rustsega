# Every push to main and every PR runs the exact gate agents run locally
# (AGENTS.md section 4): `nix develop -c just check`. CI must evaluate the same
# nix dev shell, so the toolchain and the wasm32 target come from
# rust-toolchain.toml via flake.nix -- never from a hand-rolled apt/rustup setup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One lane per ref (branch or PR): pushing again cancels the previous, now
# meaningless run instead of burning minutes of a private repo's allowance on a
# commit nobody is going to merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    # Bound a hung run; `just check` from a warm cache is a few minutes. The cap
    # has to cover the main-only `just test-all` step below too, since a step
    # timeout can only be shorter than the job's, not longer.
    timeout-minutes: 105

    steps:
      - name: Checkout
        # Latest major as of 2026-11-05 (v7.0.1). Checked against the action's
        # README, not guessed. v7 is Node 24 based; ubuntu-latest's hosted runner
        # is new enough. Its new fork-PR hardening only affects
        # pull_request_target/workflow_run, which this workflow does not use.
        uses: actions/checkout@v7

      - name: Install Nix
        # Latest major as of 2026-11-05 (v31.11.3). Enables the nix-command and
        # flakes experimental features this flake needs and makes the CI user a
        # trusted user, which is what lets the store cache below work.
        uses: cachix/install-nix-action@v31
        with:
          # Built-in token, not a repository secret: avoids anonymous GitHub
          # rate limits while Nix fetches the flake inputs.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix store cache
        # Latest major as of 2026-11-05 (v15). Chosen over
        # nix-community/cache-nix-action because it needs zero config and zero
        # secrets: it caches whatever this run builds into the GitHub Actions
        # cache, which every run of this repo can read. A Cachix cache would
        # need a write token this repo does not have, and the repo is private so
        # the public Determinate/NixOS caches are not an option for our own work.
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          # FlakeHub needs an account plus OIDC trust; this repo has neither and
          # this keeps the action from trying. Everything stays in the free,
          # private GitHub Actions cache.
          use-flakehub: false
          use-gha-cache: enabled
          # No telemetry out of a private repo.
          diagnostic-endpoint: ""

      - name: Cache cargo registry and target dir
        # Latest major as of 2026-11-05 (v6.1.0). Keyed on the three inputs that
        # can invalidate cargo artifacts: the dependency graph, the rustc
        # version, and the nixpkgs revision the toolchain is built from.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache public test data
        # `scripts/fetch-test-data.sh` fills test-roms/ from pinned URLs and
        # records a SHA-256 stamp per suite there, so the whole directory is the
        # cache: a hit means the fetch step below prints "up to date" and makes
        # no request at all. Keyed on the script itself, because the manifest --
        # every pinned URL and hash -- lives at the top of it: bump a pin and the
        # key changes and the data is refetched. Latest major as of 2026-11-06
        # (v6.1.0), same action as the cargo cache above (the ticket suggested
        # v4; this repo already runs v6).
        uses: actions/cache@v6
        with:
          path: test-roms
          key: ${{ runner.os }}-testroms-${{ hashFiles('scripts/fetch-test-data.sh') }}
          restore-keys: |
            ${{ runner.os }}-testroms-

      - name: Fetch public test data
        # Before `just check`, so the data-driven tests run against real data
        # instead of printing SKIPPED. Failing here is deliberate: if a pinned
        # URL dies, every run from then on should say so loudly rather than
        # quietly skip the suites that need it. Nothing copyrighted is ever
        # fetched: see docs/test-roms.md for the sources and docs/TESTING.md
        # section 7 for the pins.
        run: nix develop -c scripts/fetch-test-data.sh

      - name: just check
        run: nix develop -c just check

      - name: just test-all (main only)
        # The slow #[ignore] suites (full SingleStepTests, long ROM runs) run on
        # main, where a late failure is information, and not on PRs, where they
        # would just make every merge wait. Same runner as `just check`, so it
        # reuses the nix store, the cargo artifacts, and the test-roms/ this job
        # already fetched: the extra cost is the test time, not another setup.
        # Commercial ROM tests stay local: they find nothing here and skip.
        if: github.event_name == 'push'
        timeout-minutes: 60
        run: nix develop -c just test-all
