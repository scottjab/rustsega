[package]
name = "web"
description = "Browser frontend (Leptos, built with trunk)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# The in-browser frame-budget test (M7-21, #154). Off by default, and not a
# runtime skip: that test `include_bytes!`s a cartridge named by the
# `RUSTSEGA_PERF_ROM` environment variable, and `include_bytes!` is a compile-time
# path, so an unset variable has to mean a file that is never compiled rather
# than a test that prints `SKIPPED`. `just perf-web` turns it on; nothing else does.
perf-rom = []

[dependencies]
console_error_panic_hook = "0.1"
# The console: its cartridge header parser is what `rom.rs` reads a ROM with
# (M3-01, #61). It builds for wasm32 like every core crate.
genesis = { path = "../genesis" }
# The frame the canvas draws is `vdp::FrameBuffer`, and naming its type here is
# the only way to say what the draw path converts (M7-04, #137). `genesis`
# already reaches the browser through it; this is a path dependency, not a new
# crate in the binary.
vdp = { path = "../vdp" }
leptos = { version = "0.8", features = ["csr"] }
# ROM identity for SRAM and save-state keys (M7-03, #136): pure Rust, so it
# costs nothing on the way to wasm.
sha1_smol = "1"
# The workspace pin, `=0.2.130`, which is the dev shell's `wasm-bindgen
# --version` (AGENTS.md 1). Needed for the `Closure` that arms a toast's
# auto-dismiss timer (M7-02, #135).
wasm-bindgen = { workspace = true }
# For the `js_sys::Function` handle `Window::set_timeout_*` wants.
js-sys = "0.3"
# Already in the tree through leptos; a direct dependency because reading a
# dropped `File` awaits `File::array_buffer()` with `JsFuture` (M7-03, #136).
wasm-bindgen-futures = "0.4"
# The same wasm-bindgen family as leptos itself, and the only way to reach
# `document`/`window`: the theme writes `data-theme` on `<html>` (M7-02, #135).
web-sys = { version = "0.3", features = [
  # The audio output of M7-05 (#138): a context, a buffer per block of console
  # sound, a source node to play it, and a gain in front of the destination.
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioContextOptions",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "GainNode",
  "Blob",
  "CanvasRenderingContext2d",
  # The WebGL path of M7-13 (#146) reports a shader it could not compile and a GL
  # error it did not expect, because either one is a black screen rather than an
  # exception a toast could show.
  "console",
  # The spatial walk of M7-11 (#144) has to know which controls a player can see,
  # and `visibility` - which is how the shut drawer hides itself - is only
  # readable off the computed style.
  "CssStyleDeclaration",
  "DataTransfer",
  # The touch overlay's geometry (M7-09, #142): `getBoundingClientRect` answers one
  # of these, and it is how a slide from one control to another is measured.
  "DomRect",
  "Document",
  # The keyboard of M7-07 (#140): `Event::target` to see what a key landed on,
  # and the untyped `blur` that lets go of every held key.
  "Event",
  "EventTarget",
  "DragEvent",
  "Element",
  "File",
  "FileList",
  # The gamepads of M7-08 (#141): the pad itself, one of its buttons, the
  # hotplug event that names it, the `navigator` that polls them, and the mapping
  # string that says whether it follows the standard layout.
  "Gamepad",
  "GamepadButton",
  "GamepadEvent",
  "GamepadMappingType",
  "HtmlCanvasElement",
  # The focus the spatial walk moves (M7-11, #144): `focus`, `blur`, `click`, and
  # the `getBoundingClientRect` a candidate is measured by.
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "ImageData",
  "KeyboardEvent",
  # The touch overlay of M7-09 (#142): the pointer events, the box each control
  # is measured in, the media query that says this is a finger, and the `navigator`
  # that vibrates - which is already here for the gamepads.
  "MediaQueryList",
  "Navigator",
  # `querySelectorAll` hands the walk its candidates as a list of nodes.
  "Node",
  "NodeList",
  "PointerEvent",
  # The save watcher's clock (M7-14, #147): `performance.now()`, which is the
  # timebase an animation frame's own timestamp is on, so a flush timed from the
  # frame loop and one timed from `pagehide` are on the same ruler.
  "Performance",
  # The fullscreen screen of M7-12 (#145): the observer that reports the room the
  # picture has, the element that goes fullscreen, and the orientation the phone
  # is asked to hold - which desktop Chrome refuses, so `Screen` and
  # `OrientationLockType` are here for the call that is allowed to fail.
  "ResizeObserver",
  "ResizeObserverEntry",
  "Screen",
  "ScreenOrientation",
  "OrientationLockType",
  # The settings store of M7-10 (#143): `window().local_storage()` and the two
  # items this reads and writes. Chosen over `gloo-storage` because web-sys is
  # already a direct dependency and `Storage` is the whole of the extra surface.
  "Storage",
  "Window",
  # The WebGL2 renderer of M7-13 (#146): the context, the two programs and their
  # uniforms, the one frame texture, and the quad they are drawn with.
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
] }
# `Bindings` is rebindable and stored in `localStorage` (docs/ARCHITECTURE.md,
# "Input"), so its `Serialize`/`Deserialize` derive needs `serde` at runtime,
# not just under `cfg(test)` (M7-06, #139).
serde = { workspace = true }
# Promoted from a dev-dependency by M7-10 (#143): `Settings::from_json` is the
# store itself, so the JSON is now read and written at run time rather than only
# in a round-trip test.
serde_json = { workspace = true }
rexie = "0.6"

# Browser tests (M7-20, #153), wasm32 only: `just test-web` runs them in headless
# Firefox through `wasm-bindgen-test-runner`, which is part of the dev shell's
# `wasm-bindgen-cli` (see `flake.nix`). `0.3.80` is the release that depends on
# `wasm-bindgen = "=0.2.130"`, the workspace pin and the CLI version, so the
# runtime and the runner agree; every release of this crate names exactly one
# `wasm-bindgen` patch, so bump it with the pin and not on its own (AGENTS.md 1).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
