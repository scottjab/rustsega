[package]
name = "vdp"
description = "Sega Genesis VDP (video display processor)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# Serialising the chip state for save states (M6-07, #127). Optional and default
# on: `--no-default-features` keeps the core dependency-free, per the rule in
# docs/ARCHITECTURE.md that the core itself carries nothing.
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
# Debug views of VDP internals (`debug`): pattern, plane, sprite and palette
# dumps to RGBA buffers. Default off so that neither the emulator nor the WASM
# build carries the renderer.
debug-views = []

[dev-dependencies]
# Round-trip of the saved chip state (M6-07, #127): tests only.
postcard = { version = "1", features = ["alloc"] }

# The round-trip test only compiles with the derives, i.e. with the `serde`
# feature on; `--no-default-features` skips it rather than failing to build it.
[[test]]
name = "state_roundtrip"
required-features = ["serde"]

[lints]
workspace = true
