# The commercial games run by `tests/commercial.rs` (M6-04, #123).
#
# `prefix` is the exact file name of the cartridge under `$RUSTSEGA_ROM_DIR`
# without its extension - `testkit::commercial_rom` takes an exact name. It is
# not a prefix lookup: `testkit::find_commercial_rom` does prefix matching and
# lands on a Beta build sitting under the same stem, which is not the game
# under test.
#
# `key` names the golden key, which is `<key>_<frames>` in
# `tests/golden/commercial.toml`, and the picture of the last frame in
# `target/test-output/commercial/`.
#
# `start_press` is a list of 1-based frame numbers on which port 1 holds START
# (`common::run_frames`, `crates/headless/src/run.rs`), which is how a game that
# waits on "PRESS START" gets past it into a picture worth hashing.
#
# The list is deliberately wider than "Sonic and see if it crashes". These
# entries cover SRAM (Phantasy Star II/IV), EEPROM (NBA Jam), the Super Street
# Fighter II cart mapper, and a banked/mega cartridge (Sonic 3D Blast).
#
# Three more were ready to go in and are held out because they panic before the
# checkpoint, not because they are uninteresting: `Aladdin (USA)`,
# `Earthworm Jim (USA)` and `Ecco the Dolphin (USA, Europe, Korea) (En)` die in
# the YM2612 LFO - [#349](https://github.com/scottjab/rustsega/issues/349). Add
# them back when that is fixed.

[[game]]
key = "sonic1"
prefix = "Sonic The Hedgehog (USA, Europe)"
frames = 600
start_press = [300, 301]

[[game]]
key = "sonic2"
prefix = "Sonic The Hedgehog 2 (World)"
# 600 is a fade to black on the way from the title to the level: the run that
# takes 2 colours at 600 has 24 by 900.
frames = 900
start_press = [300, 301]

