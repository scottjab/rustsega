[package]
name = "ym2612"
description = "Yamaha YM2612 FM synthesizer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# Serialising the chip state for save states (M6-07a, #126). Optional and default
# on: `--no-default-features` keeps the core dependency-free, per the rule in
# docs/ARCHITECTURE.md that the core itself carries nothing.
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
# Round-trip of the saved chip state (M6-07a, #126): tests only.
postcard = { version = "1", features = ["alloc"] }

# The round-trip test only compiles with the derives, i.e. with the `serde`
# feature on; `--no-default-features` skips it rather than failing to build it.
[[test]]
name = "state_roundtrip"
required-features = ["serde"]

[lints]
workspace = true
