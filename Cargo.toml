[workspace]
resolver = "3"
members = [
    "crates/m68k", "crates/z80", "crates/vdp", "crates/ym2612", "crates/sn76489",
    "crates/genesis", "crates/testkit", "crates/headless", "crates/web", "crates/server",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Pinned to the wasm-bindgen-cli version in the nix dev shell. Must match exactly.
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
png = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Tests run the CPU cores millions of times. Keep them fast.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
